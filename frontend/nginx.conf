# Serves the built React app and forwards /api to the API containers.
# Docker's DNS returns every "api" container, so requests are spread across
# all of them (round robin).
#
# HTTPS: terminate TLS in front of this container (cloud load balancer,
# Caddy, or another nginx with certificates) — see DEPLOYMENT.md. Browsers
# only allow the microphone on HTTPS (or localhost).
upstream bolobank_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Voice recordings are limited to 5 MB by the API; allow a little headroom.
    client_max_body_size 6m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers (no add_header inside locations, so these always apply).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; connect-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:" always;

    location /api/ {
        proxy_pass http://bolobank_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI answers can take several seconds; voice uploads need time too.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Built files have content hashes in their names: cache them for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The app itself: always re-check, and send every route to index.html.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
